<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MDT / WDS - Diagrama interactivo neón</title>
<style>
  body {
    margin: 0;
    background: #0a0e14;
    font-family: Arial, Helvetica, sans-serif;
    color: #d7e6f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 60px;
  }
  h1 { font-size: 20px; color: #7fd8ff; text-shadow: 0 0 8px #2fb8ff, 0 0 18px #2fb8ff; margin: 0 0 4px; }
  p.sub { color: #93a8bd; margin: 0 0 20px; font-size: 13px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 18px;
    max-width: 1024px;
  }
  .controls button {
    background: #0f1826;
    border: 1px solid #2a3f57;
    color: #a9c4de;
    padding: 8px 14px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
  }
  .controls button:hover {
    border-color: #4fd1ff;
    color: #eafcff;
  }
  .controls button.active {
    border-color: #4fd1ff;
    color: #0a0e14;
    background: #4fd1ff;
    box-shadow: 0 0 10px #2fb8ff, 0 0 24px rgba(47,184,255,.6);
  }

  svg { max-width: 1024px; width: 100%; height: auto; }

  #desc {
    max-width: 700px;
    text-align: center;
    min-height: 40px;
    font-size: 13px;
    color: #bcd4ea;
    margin-top: 14px;
  }

  /* base element styling for dark neon canvas */
  .panel { fill: #0f1826; stroke: #223349; }
  .panelSoft { fill: #101d2c; stroke: #2a3f57; }
  .whiteBox { fill: #0c1420; stroke: #2a3f57; }
  .badge { fill: #123a5c; stroke: #3fa9e8; }
  .badgeText { fill: #cdeaff; }
  .icon { fill: #16283b; stroke: #3a5b7c; }
  .iconScreen { fill: #1c3a54; }
  .label { fill: #cfe3f5; }
  .labelDim { fill: #7f97ac; }
  .dashed { stroke-dasharray: 6 4; }

  /* glow classes toggled by JS */
  .glow-blue   { filter: drop-shadow(0 0 4px #33baff) drop-shadow(0 0 12px #33baff); }
  .glow-green  { filter: drop-shadow(0 0 4px #33ffb0) drop-shadow(0 0 12px #33ffb0); }
  .glow-amber  { filter: drop-shadow(0 0 4px #ffbb33) drop-shadow(0 0 12px #ffbb33); }
  .glow-pink   { filter: drop-shadow(0 0 4px #ff4fd8) drop-shadow(0 0 12px #ff4fd8); }
  .glow-purple { filter: drop-shadow(0 0 4px #a866ff) drop-shadow(0 0 12px #a866ff); }

  .flowline {
    stroke-dasharray: 8 6;
    animation: dashmove 1s linear infinite;
  }
  @keyframes dashmove { to { stroke-dashoffset: -28; } }

  .pulseNode {
    animation: pulseGlow 1.6s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flowline, .pulseNode { animation: none; }
  }

  .clickable { cursor: pointer; }

  #popupOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4,8,14,.65);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #popupOverlay.show { display: flex; }

  #popupBox {
    max-width: 420px;
    background: #0f1826;
    border: 1px solid #3fa9e8;
    border-radius: 10px;
    padding: 20px 22px;
    box-shadow: 0 0 12px #2fb8ff, 0 0 30px rgba(47,184,255,.5);
    position: relative;
  }
  #popupTitle {
    font-size: 15px;
    font-weight: bold;
    color: #7fd8ff;
    text-shadow: 0 0 6px #2fb8ff;
    margin: 0 0 10px;
  }
  #popupText {
    font-size: 13px;
    line-height: 1.6;
    color: #cdeaff;
    margin: 0;
  }
  #popupClose {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    color: #7f97ac;
    font-size: 16px;
    cursor: pointer;
  }
  #popupClose:hover { color: #eafcff; }
</style>
</head>

<script>
var descs = {
  1: "El equipo cliente inicia el flujo: arranca por red (PXE Boot) y, en el escenario de alto contacto, recibe la imagen (Imaging) directamente.",
  2: "La petición cruza la red de despliegue aislada — el switch dedicado que separa este tráfico de la red de producción.",
  3: "El servidor WDS atiende la solicitud PXE, entrega el gestor de arranque por TFTP y prepara el entorno de preinstalación.",
  4: "El servidor MDT aporta el Workbench: secuencias de tareas, paquetes e imágenes de sistema operativo listas para aplicar.",
  5: "Se ejecuta la secuencia de tareas (Task Sequence Execution) que conecta el hub de despliegue con el laboratorio de referencia.",
  6: "En el laboratorio se genera la imagen de referencia, se le aplica sysprep y queda lista para reutilizarse en futuros despliegues.",
  7: "La consola del administrador MDT permite supervisar y controlar todo el proceso de despliegue desde un solo panel."
};

var stageElements = {
  1: ["s1a","s1arrow1","s1b","s1icon1","s1icon2","s1icon3","s2a","s2arrow1","s2b","s2icon1","s2icon2","s2icon3"],
  2: ["pxeReqLine","switchIcon","osImgLine"],
  3: ["wdsBox"],
  4: ["mdtBox"],
  5: ["taskSeqLine","switchToWds"],
  6: ["refImgDoc","refToSysprep","sysprepServer","sysprepToSwitch","labSwitch"],
  7: ["consoleBox"]
};

var stageGlow = {1:"glow-blue",2:"glow-blue",3:"glow-green",4:"glow-amber",5:"glow-pink",6:"glow-purple",7:"glow-green"};

function clearAll() {
  Object.keys(stageElements).forEach(function(k){
    stageElements[k].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      el.classList.remove("glow-blue","glow-green","glow-amber","glow-pink","glow-purple","pulseNode","flowline");
    });
  });
}

function setStage(n) {
  clearAll();
  var glowClass = stageGlow[n];
  stageElements[n].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.add(glowClass, "pulseNode");
    if (el.tagName === "line" || el.tagName === "path") {
      el.classList.add("flowline");
    }
  });
  document.getElementById("desc").textContent = descs[n];
  document.querySelectorAll(".controls button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-stage") == n);
  });
}

document.querySelectorAll(".controls button").forEach(function(btn){
  btn.addEventListener("click", function(){
    setStage(this.getAttribute("data-stage"));
  });
});

setStage(1);

var popupData = {
  s1a: { title: "PXE Boot", text: "El cliente sin sistema operativo lanza una solicitud de arranque por red." },
  switchIcon: { title: "Red aislada", text: "Esa solicitud cruza una red de despliegue separada de producción." },
  wdsBox: { title: "WDS", text: "El servidor responde con TFTP/preboot y entrega el gestor de arranque." },
  mdtBox: { title: "MDT", text: "Ejecuta la secuencia de tareas (task sequence): imagen, drivers, paquetes." },
  sysprepServer: { title: "Imagen de referencia", text: "Se hace sysprep del equipo configurado y se captura para reutilizar en futuros despliegues." }
};

var popupOverlay = document.getElementById("popupOverlay");
var popupTitle = document.getElementById("popupTitle");
var popupText = document.getElementById("popupText");

function openPopup(key) {
  var data = popupData[key];
  if (!data) return;
  popupTitle.textContent = data.title;
  popupText.textContent = data.text;
  popupOverlay.classList.add("show");
}

function closePopup() {
  popupOverlay.classList.remove("show");
}

Object.keys(popupData).forEach(function(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("click", function(e) {
    e.stopPropagation();
    openPopup(id);
  });
});

document.getElementById("popupClose").addEventListener("click", closePopup);
popupOverlay.addEventListener("click", function(e) {
  if (e.target === popupOverlay) closePopup();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closePopup();
});
</script>
