<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autoevaluación AD DS · Neon Quiz</title>
<style>
:root{
  --bg:#000;
  --ink:#f4f7ff;
  --dim:#8d95b5;
  --c0:#ff2e63; /* rojo - triángulo */
  --c1:#19c3ff; /* cian - rombo */
  --c2:#ffe600; /* amarillo - círculo */
  --c3:#39ff14; /* verde - cuadrado */
  --mag:#4d7cff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
/* ---------- Fondo neón ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%}
.glow-a{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.22;z-index:0;pointer-events:none}
.glow-a.m{background:var(--mag);top:-30vmax;left:-20vmax}
.glow-a.c{background:var(--c1);bottom:-35vmax;right:-20vmax}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.float{animation:drift 7s ease-in-out infinite}
.float:nth-child(2n){animation-duration:9s;animation-delay:-3s}
.float:nth-child(3n){animation-duration:11s;animation-delay:-5s}

#app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:18px 16px 40px}

/* ---------- Barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.chip{
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:13px;
  background:rgba(8,8,20,.7);box-shadow:0 0 12px rgba(25,195,255,.15) inset;white-space:nowrap
}
.chip b{font-size:16px;color:var(--c1);text-shadow:0 0 8px var(--c1)}
.chip.score b{color:var(--c2);text-shadow:0 0 8px var(--c2)}
.chip.streak b{color:var(--mag);text-shadow:0 0 8px var(--mag)}
.mute{
  background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ink);border-radius:999px;
  width:38px;height:34px;cursor:pointer;display:grid;place-items:center
}
.mute:hover{border-color:var(--c1);box-shadow:0 0 12px var(--c1)}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--c1));box-shadow:0 0 12px var(--c1);transition:width .4s}

/* ---------- Pantalla de inicio ---------- */
.hero{text-align:center;padding:30px 8px 10px}
.hero svg.logo{width:150px;height:150px;margin-bottom:6px}
h1{
  font-size:clamp(26px,5.2vw,44px);letter-spacing:1px;line-height:1.15;margin-bottom:10px;
  color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--mag),0 0 38px var(--mag),0 0 70px var(--mag);
}
@keyframes flick{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}20%,24%,55%{opacity:.55}}
h1 .fl{animation:flick 5s infinite}
.sub{color:var(--dim);font-size:15px;margin-bottom:22px}
.rules{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 26px;max-width:640px;text-align:left
}
